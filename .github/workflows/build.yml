# Builds the project and runs the tests on every pull request to main, and on main itself.
# The main branch ruleset requires the "Build and test" check to pass before a pull request can be merged.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The job only reads the code.
permissions:
  contents: read

# A new push to a pull request cancels that pull request's run if it's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Pinned rather than ubuntu-latest, so the compiler (g++ 13) only changes when this line does.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: make -j"$(nproc)"

      - name: Build the Foundry importer
        run: make -j"$(nproc)" build/import-foundry

      - name: Test
        run: make test

      - name: Run the example
        run: make run
